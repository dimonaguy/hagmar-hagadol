<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>הגמר הגדול: כוכב הריאליטי</title>
  <meta name="description" content="משחק בחר-את-הרפתקאות עברי בסגנון ריאליטי — By Netanel Hasson">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header id="status-bar" aria-label="סטטוס">
      <div class="stat-box">
        <span class="stat-label">פופולריות</span>
        <span class="stat-value" id="stat-popularity">—</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">בריתות</span>
        <span class="stat-value" id="stat-alliances">—</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">שפיות</span>
        <span class="stat-value" id="stat-sanity">—</span>
      </div>
    </header>

    <section id="story-bar">
      <div class="title-row">
        <h1 id="node-title">טוען...</h1>
        <span class="creator-credit" id="creator-credit"></span>
      </div>
      <p id="node-desc"></p>
    </section>

    <div id="stage-wrapper">
      <div id="stage-bg" role="img" aria-label="רקע הסצנה"></div>
      <div id="overlay-container"></div>
    </div>

    <div id="mobile-choices" aria-label="אפשרויות"></div>
    <div id="load-error" hidden></div>
  </div>
  <script src="assets-data-0.js"></script>
  <script src="assets-data-1.js"></script>
  <script src="assets-data-2.js"></script>
  <script src="assets-data-3.js"></script>
  <script src="assets-data-4.js"></script>
  <script src="assets-data-5.js"></script>
  <script src="assets-data-6.js"></script>
  <script src="assets-data-7.js"></script>
  <script src="assets-data-8.js"></script>
  <script src="assets-data-9.js"></script>
  <script src="assets-data-10.js"></script>
  <script src="app.js"></script>
</body>
</html>
